# Único publicador del frontend de staging.
# Proyecto pegazuz-frontend-staging, no el de producción.
# En ese proyecto: Settings → Git → Disconnect, para que un push no publique.
# --prod actualiza el dominio estable de ESE proyecto.
# STAGING_DEPLOY_ENABLED y STAGING_NATIVE_DEPLOY son variables del repositorio.
# Una variable de entorno de GitHub no llega a la condición del job.
# Sigue apagado hasta que la primera sea true y la segunda sea off.
name: Staging preview

on:
  push:
    branches:
      - genesis/staging
  workflow_dispatch:

concurrency:
  group: pegazuz-staging-frontend
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/crm-verify.yml

  deploy:
    needs: verify
    if: vars.STAGING_DEPLOY_ENABLED == 'true' && vars.STAGING_NATIVE_DEPLOY == 'off'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: El proyecto y el API no pueden ser los de producción
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ vars.PRODUCTION_VERCEL_PROJECT_ID }}
          STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          STAGING_PUBLIC_HOST: ${{ vars.STAGING_PUBLIC_HOST }}
          STAGING_NATIVE_DEPLOY: ${{ vars.STAGING_NATIVE_DEPLOY }}
        run: node --input-type=module -e "import { assertStagingRelease } from './scripts/assert-staging-preview.mjs'; assertStagingRelease(process.env);"
      - name: Comprobar el bundle antes de publicarlo
        env:
          VITE_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          STAGING_PUBLIC_HOST: ${{ vars.STAGING_PUBLIC_HOST }}
        run: |
          npm run build
          node scripts/assert-staging-bundle.mjs dist
      - name: Publicar el dominio de staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VITE_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "faltan el token o los identificadores del proyecto de staging"
            exit 1
          fi
          rm -rf .vercel
          npx --yes vercel deploy --prod --yes --project "$VERCEL_PROJECT_ID" \
            --build-env "VITE_API_ORIGIN=$VITE_API_ORIGIN" \
            --build-env "VITE_API_BASE_URL=$VITE_API_BASE_URL"
