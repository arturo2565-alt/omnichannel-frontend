# Verifica el frontend. No despliega y no usa secretos de producción.
name: CRM verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - genesis/crm-010

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/assert-staging-preview.test.mjs
      - run: npm run build
