# Verifica el frontend. No despliega y no usa secretos de producción.
name: CRM verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/assert-staging-preview.test.mjs scripts/assert-staging-bundle.test.mjs scripts/assert-catalog-admin.test.mjs scripts/assert-actions-node.test.mjs scripts/assert-fe-016a.test.mjs scripts/assert-calibration-query.test.mjs scripts/assert-spa-fallback.test.mjs src/labInbox.test.js src/sessionQuery.test.js src/calibrationCache.test.js src/workshopCache.test.js src/panel-tariff-resolution.test.js
      - run: npm run build
